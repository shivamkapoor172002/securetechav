        .hero-section {

        }

        @media(min-width:768px) {

            }
        }

        /* ── SECTORS ──
           One carousel for every width: copy on the left, a horizontal rail of
           photographs on the right that runs off the edge of the page so the
           next sector is always half-visible. Driven by --i (the active index)
           rather than scroll position, so the arrows, the rail and the
           progress bar cannot disagree. */
        .sect-section {
            background: #f4f6f8;
            padding: 4.5rem 0;
            overflow: hidden;
        }

        .sect-inner {
            max-width: 1500px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.25rem;
            padding-left: 1.5rem;
        }

        @media (min-width: 900px) {
            .sect-section {
                padding: 6.5rem 0;
            }

            .sect-inner {
                grid-template-columns: minmax(20rem, 30%) 1fr;
                gap: 3.5rem;
                align-items: center;
                padding-left: max(1.5rem, calc((100vw - 1500px) / 2 + 1.5rem));
            }
        }

        /* ── copy column ── */
        .sect-copy {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding-right: 1.5rem;
        }

        .sect-standfirst {
            font-size: .95rem;
            font-weight: 500;
            color: #3A1210;
            margin: 0 0 1.1rem;
        }

        /* every slide's copy is stacked in the same place and cross-faded */
        .sect-names,
        .sect-bodies {
            position: relative;
        }

        .sect-names>*,
        .sect-bodies>* {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity .45s ease, transform .45s cubic-bezier(.16, 1, .3, 1);
            pointer-events: none;
        }

        .sect-names>.on,
        .sect-bodies>.on {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .sect-names {
            height: clamp(2.6rem, 5vw, 3.6rem);
        }

        .sect-name {
            font-size: clamp(2rem, 4.2vw, 3.1rem);
            font-weight: 600;
            letter-spacing: -.03em;
            line-height: 1.1;
            color: #3A1210;
            margin: 0;
        }

        .sect-bodies {
            height: 11.5rem;
            margin-top: .85rem;
        }

        .sect-body {
            font-size: .98rem;
            line-height: 1.75;
            color: #55636f;
            margin: 0;
        }

        .sect-cta {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            min-height: 46px;
            padding: .7rem 1.6rem;
            border-radius: 10px;
            background: #E87D2F;
            color: #fff;
            font-size: .92rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .25s ease, transform .25s ease;
        }

        .sect-cta:hover,
        .sect-cta:focus-visible {
            background: #cf6a20;
            transform: translateY(-1px);
        }

        /* ── progress ── */
        .sect-progress {
            margin-top: 2.5rem;
            width: min(20rem, 100%);
            height: 3px;
            background: #dbe1e7;
            border-radius: 2px;
            overflow: hidden;
        }

        .sect-progress i {
            display: block;
            height: 100%;
            background: #E87D2F;
            border-radius: 2px;
            transform-origin: left center;
            transform: scaleX(var(--fill, 0));
            transition: none;
        }

        /* ── image rail ── */
        .sect-stage {
            position: relative;
            --gap: 16px;
            --card: min(78vw, 460px);
            min-width: 0;
            /* clip the rail to the stage, otherwise cards that have scrolled
               past keep painting over the copy column on their way out */
            overflow: hidden;
        }

        @media (min-width: 900px) {
            .sect-stage {
                --card: min(46vw, 760px);
            }
        }

        .sect-rail {
            display: flex;
            gap: var(--gap);
            transform: translate3d(calc(var(--i, 0) * -1 * (var(--card) + var(--gap))), 0, 0);
            transition: transform .7s cubic-bezier(.16, 1, .3, 1);
            will-change: transform;
        }

        .sect-shot {
            flex: 0 0 var(--card);
            margin: 0;
            height: clamp(17rem, 42vw, 31rem);
            border-radius: 14px;
            overflow: hidden;
            background: #3A1210;
        }

        .sect-shot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity .5s ease;
        }

        /* the sectors either side of the active one sit back a little */
        .sect-shot:not(.on) img {
            opacity: .55;
        }

        /* ── arrows ── */
        .sect-nav {
            position: absolute;
            top: 50%;
            left: 0;
            width: var(--card);
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 1.1rem;
            pointer-events: none;
        }

        .sect-arrow {
            pointer-events: auto;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 0;
            background: #E87D2F;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(10, 22, 40, .28);
            transition: background .25s ease, transform .25s ease, opacity .25s ease;
        }

        .sect-arrow:hover:not(:disabled),
        .sect-arrow:focus-visible:not(:disabled) {
            background: #cf6a20;
            transform: scale(1.07);
        }

        .sect-arrow:disabled {
            opacity: .35;
            cursor: default;
        }

        @media (prefers-reduced-motion: reduce) {

            .sect-rail,
            .sect-names>*,
            .sect-bodies>*,
            .sect-progress i {
                transition: none;
            }
        }

        /* ── PRODUCTS ── */
        .products-mobile {

                            <svg class="lang-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
                        </button>
                    </div>
                </div>                <a href="/Contactus" style="display:none;" id="desktop-cta"><button class="pill-button">Contact
                        Us</button></a>
                <button id="menu-btn"
                    style="display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#fff;padding:.5rem;"
                    aria-label="Open menu">
                    <svg id="icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                    <svg id="icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />

                </button>

    <div class="designer-shell">

            <p class="designer-fallback">The Workspace Designer needs JavaScript enabled.</p>

            allow="fullscreen; xr-spatial-tracking"></iframe>
    </div>

    <script src="{{ url_for('static', filename='lang-switcher.js') }}" defer></script>
    <script>
            // ── Desktop nav ──
            (function () {
                const dn = document.getElementById('desktop-nav'), dc = document.getElementById('desktop-cta'), mb = document.getElementById('menu-btn');
                function cw() { if (window.innerWidth >= 1024) { dn.style.display = 'flex'; dc.style.display = 'block'; mb.style.display = 'none'; } else { dn.style.display = 'none'; dc.style.display = 'none'; mb.style.display = 'flex'; } }
                cw(); window.addEventListener('resize', cw);
            })();

        // ── Mobile menu ──
        const menuBtn = document.getElementById('menu-btn'), mobileMenu = document.getElementById('mobile-menu'), iconOpen = document.getElementById('icon-open'), iconClose = document.getElementById('icon-close');
        let menuOpen = false;
        menuBtn.addEventListener('click', () => { menuOpen = !menuOpen; mobileMenu.classList.toggle('open', menuOpen); iconOpen.style.display = menuOpen ? 'none' : 'block'; iconClose.style.display = menuOpen ? 'block' : 'none'; document.body.style.overflow = menuOpen ? 'hidden' : ''; });
        function closeMenu() { menuOpen = false; mobileMenu.classList.remove('open'); iconOpen.style.display = 'block'; iconClose.style.display = 'none'; document.body.style.overflow = ''; }

    </script>
