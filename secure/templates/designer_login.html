<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Designer access — SecureTech AV Designs</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="{{ url_for('static', filename='just_logo_no_text.webp') }}">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --st-brand: #6E1B18;
            --st-brand-deep: #4A100E;
            --st-accent: #d9622d;
            --bg: #faf7f4;
            --text: #241F1D;
            --text-2: #4A403C;
            --border: #efe6df;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
        }

        header {
            background: rgba(255, 255, 255, .94);
            border-bottom: 1px solid var(--border);
        }

        header .bar {
            max-width: 1460px;
            margin: 0 auto;
            padding: 0 24px;
            height: 68px;
            display: flex;
            align-items: center;
        }

        header .brand {
            display: flex;
            align-items: center;
            gap: .6rem;
            text-decoration: none;
            color: var(--st-brand);
            font-weight: 700;
        }

        header .brand img { height: 40px; }

        main {
            max-width: 420px;
            margin: 0 auto;
            padding: 92px 24px 80px;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px;
            color: var(--st-brand);
        }

        p {
            color: var(--text-2);
            line-height: 1.55;
            margin: 0 0 24px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: .8rem;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            font-size: 1rem;
            font-family: inherit;
        }

        input:focus {
            outline: 2px solid var(--st-brand);
            outline-offset: 1px;
        }

        button {
            margin-top: 16px;
            width: 100%;
            height: 46px;
            border-radius: 24px;
            border: 2px solid var(--st-brand);
            background: transparent;
            color: var(--st-brand);
            font-weight: 700;
            font-size: .85rem;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover {
            border-color: var(--st-brand-deep);
            color: var(--st-brand-deep);
        }

        .err {
            margin: 0 0 16px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(110, 27, 24, .08);
            color: var(--st-brand);
            font-size: .85rem;
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            color: var(--text-2);
            font-size: .82rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="bar">
            <a class="brand" href="/">
                <img src="{{ url_for('static', filename='just_logo_no_text.webp') }}"
                    alt="SecureTech AV Designs">
                <span>SecureTech AV Designs</span>
            </a>
        </div>
    </header>

    <main>
        <h1>Designer access</h1>
        <p>Opening <strong>{{ room_name }}</strong> in the configurator needs the administrator
            password. Browsing the room types does not.</p>

        {% if error %}<p class="err">{{ error }}</p>{% endif %}

        <form method="post" autocomplete="off">
            <label for="password">Administrator password</label>
            <input id="password" name="password" type="password" required autofocus
                autocomplete="current-password">
            <button type="submit">Open the designer</button>
        </form>

        <a class="back" href="{{ url_for('workspace_designer') }}">← Back to the room types</a>
    </main>
</body>

</html>
